<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repair Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Repair Log</h1>

    <form id="repair-form">
      <input type="text" id="client" placeholder="Client" required>
      <input type="text" id="device" placeholder="Device" required>
      <input type="text" id="issue" placeholder="Issue" required>
      <select id="status">
        <option value="Pending">Pending</option>
        <option value="In progress">In progress</option>
        <option value="Done">Done</option>
      </select>
      <button type="submit">Add repair</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Client</th>
          <th>Device</th>
          <th>Issue</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="repair-list"></tbody>
    </table>
  </main>

  <script src="app.js"></script>
</body>
</html>
